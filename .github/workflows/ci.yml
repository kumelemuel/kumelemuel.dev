name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies (high or critical fails)
        run: npm audit --audit-level=high

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Browser binaries are cached per Playwright version; system packages (apt) are not.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        # The runner's apt mirrors fail transiently (DNS, timeouts): retry before giving up.
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "::warning::Playwright install failed (attempt $attempt/3), retrying..."
            sleep $((attempt * 20))
            sudo apt-get update -o Acquire::Retries=3 || true
          done
          echo "::error::Playwright install failed after 3 attempts"
          exit 1

      - name: End-to-end tests (pages, CSP, axe, contact form)
        run: npm run test:e2e

      - name: Lighthouse budgets
        # Not a project dependency on purpose: it pulls in packages with open advisories.
        run: npx -y @lhci/cli@0.16.0 autorun

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
